# Content engine settings. The engine-setup Skill fills this in with you.
# Run it once: open a Claude Code session on this repo and say "set up my content engine".

author:
  name: ""                 # the name on your graphics and posts, e.g. Jane Smith
  role: ""                 # e.g. Head of Marketing at Acme
  company: ""
  linkedin_url: ""         # used in the LinkedIn follow line
  newsletter_url: ""       # optional, e.g. janesmith.substack.com
  expertise: ""            # what you can speak to from your own work; the trend report picks angles you can argue
  audience: ""             # your ICP in one line, e.g. "ops leaders at UK logistics firms with 50-500 staff"
  industry: ""
  region: ""               # blank for global
  language: en-GB          # en-GB or en-US spelling

trends_per_run: 3          # the top N radar trends each get a full pack (all the drafts below)

# What each channel's call to action says. Keep LinkedIn post CTAs simple.
cta:
  linkedin:
    type: follow_save
    lines:
      - "➕ Follow {author.name}"      # LinkedIn already links your name; add ": {author.linkedin_url}" if you want the link
      - "🔖 Save this for later"
  # subscribe: end with `line`. none: no CTA line (Notes already show a subscribe button).
  # The same line every week starts to read as boilerplate; if it does, switch to none.
  substack:
    type: subscribe
    line: ""               # e.g. "Subscribe free for one practical AI workflow a week."
  x:
    type: subscribe
    line: ""               # e.g. "More every week at janesmith.substack.com"

# Which drafts go into Buffer for each channel, for EACH trend (trends_per_run x these).
# Remove channels or slots you don't use; the engine skips any graphic no slot needs.
# Allowed assets: infographic (PNG: the LinkedIn version on LinkedIn, the Substack version on
# X and Substack), infographic_gif (animated GIF of that channel's infographic, LinkedIn and
# Substack only; falls back to the PNG), carousel (PDF document, LinkedIn only), sketch
# (hand-drawn explainer), notebook (notebook page), none.
drafts:
  linkedin:
    - {post: linkedin_infographic, asset: infographic_gif}
    - {post: linkedin_carousel, asset: carousel}
    - {post: linkedin_sketch, asset: sketch}
    - {post: linkedin_notebook, asset: notebook}
  x:
    - {post: x_infographic, asset: infographic}
    - {post: x_sketch, asset: sketch}
    - {post: x_notebook, asset: notebook}
  substack:
    - {post: substack_infographic, asset: infographic_gif}
    - {post: substack_sketch, asset: sketch}
    - {post: substack_notebook, asset: notebook}

# Substack Notes batches (substack-notes Skill): how many Notes a week you aim for.
notes:
  per_week: 21              # e.g. 21 = three a day

# Buffer. Fill these with: python3 scripts/buffer.py channels
buffer:
  organization_id: ""
  channels:
    linkedin: ""
    x: ""
    substack: ""

# Where images and PDFs go so Buffer can fetch them: a public GitHub repo with GitHub Pages on.
media:
  repo: ""                 # e.g. janesmith/content-media  (public, Pages on, branch main, folder / root)
  base_url: ""             # e.g. https://janesmith.github.io/content-media
  path_in_repo: social     # folder inside that repo
  wait_for_live_seconds: 300

# Performance review (scripts/performance.py, performance-review Skill).
# A pattern is only proposed as a rule once it is "proven": enough data first.
performance:
  window_days: 365     # how far back to look
  min_early: 5         # under this many posts a group is "not enough data"
  min_group: 10        # posts needed in the group, and in the rest, before a pattern can be proven
  min_channel: 40      # posts needed on the channel in the window before anything can be proven
  max_p: 0.05          # significance (Mann-Whitney), plus the same result in both halves of the window
  timezone: Europe/London   # your timezone, for the day and time comparisons
